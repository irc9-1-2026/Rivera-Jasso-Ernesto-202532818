services:
  # Dashboard Flask. No publica puertos en el host.
  flask-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dashboard-app
    restart: always
    env_file:
      - .env
    environment:
      LOCAL_API_URL: http://api-dispositivos:5001/dispositivos
    depends_on:
      - api-dispositivos
    networks:
      - red-interna

  # API de la Práctica 1, conservada como servicio interno.
  api-dispositivos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dashboard-api-dispositivos
    restart: always
    command:
      - gunicorn
      - -w
      - "1"
      - -b
      - 0.0.0.0:5001
      - api_dispositivos:app
    networks:
      - red-interna

  # Único servicio publicado hacia el host.
  nginx:
    image: nginx:alpine
    container_name: dashboard-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
    depends_on:
      - flask-app
    networks:
      - red-interna

networks:
  red-interna:
    driver: bridge